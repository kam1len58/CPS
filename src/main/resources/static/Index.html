<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .table-container {
            margin: 20px 0;
        }

        .action-buttons {
            white-space: nowrap;
        }

        .modal-header {
            background-color: #f8f9fa;
        }

        .student-form {
            max-width: 500px;
            margin: 0 auto;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .error-message {
            color: #dc3545;
            font-size: 0.875em;
            margin-top: 0.25rem;
        }
    </style>
</head>

<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <h1 class="text-center mb-4">
                    <i class="fas fa-user-graduate me-2"></i>Student Management System
                </h1>

                <!-- Control Panel -->
                <div class="card mb-4">
                    <div class="card-body">
                        <div class="row align-items-center">
                            <div class="col-md-6">
                                <button class="btn btn-success" onclick="showAddForm()">
                                    <i class="fas fa-plus me-1"></i>Add New Student
                                </button>
                            </div>
                            <div class="col-md-6">
                                <div class="input-group">
                                    <input type="text" class="form-control" placeholder="Search students..."
                                        id="searchInput">
                                    <button class="btn btn-outline-secondary" type="button" onclick="searchStudents()">
                                        <i class="fas fa-search"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Loading Indicator -->
                <div id="loading" class="loading">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-2">Loading students...</p>
                </div>

                <!-- Students Table -->
                <div class="card table-container">
                    <div class="card-header">
                        <h5 class="card-title mb-0">
                            <i class="fas fa-list me-2"></i>Students List
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover">
                                <thead class="table-dark">
                                    <tr>
                                        <th>ID</th>
                                        <th>Name</th>
                                        <th>Group</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="studentsTableBody">
                                    <!-- Students will be loaded here -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- No Students Message -->
                <div id="noStudents" class="alert alert-info text-center" style="display: none;">
                    <i class="fas fa-info-circle me-2"></i>No students found. Add your first student!
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Student Modal -->
    <div class="modal fade" id="studentModal" tabindex="-1" aria-labelledby="studentModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="studentModalLabel">Add New Student</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="studentForm" class="student-form">
                        <input type="hidden" id="studentId">

                        <div class="mb-3">
                            <label for="name" class="form-label">Name *</label>
                            <input type="text" class="form-control" id="name" required>
                            <div class="error-message" id="nameError"></div>
                        </div>

                        <div class="mb-3">
                            <label for="group" class="form-label">Group *</label>
                            <input type="text" class="form-control" id="group" required>
                            <div class="error-message" id="groupError"></div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveStudent()">Save Student</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="deleteModalLabel">Confirm Delete</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    Are you sure you want to delete this student? This action cannot be undone.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" onclick="confirmDelete()">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let students = [];
        let studentToDelete = null;

        // Initialize the application
        document.addEventListener('DOMContentLoaded', function () {
            loadStudents();
        });

        // Load all students
        async function loadStudents() {
            showLoading(true);
            try {
                const response = await fetch('/api/students');
                if (response.ok) {
                    students = await response.json();
                    renderStudentsTable();
                } else {
                    throw new Error('Failed to load students');
                }
            } catch (error) {
                console.error('Error loading students:', error);
                alert('Error loading students: ' + error.message);
            } finally {
                showLoading(false);
            }
        }

        // Search students
        async function searchStudents() {
            const searchTerm = document.getElementById('searchInput').value.trim();
            if (!searchTerm) {
                loadStudents();
                return;
            }

            showLoading(true);
            try {
                const response = await fetch(`/api/students?search=${encodeURIComponent(searchTerm)}`);
                if (response.ok) {
                    students = await response.json();
                    renderStudentsTable();
                } else {
                    throw new Error('Search failed');
                }
            } catch (error) {
                console.error('Error searching students:', error);
                alert('Error searching students: ' + error.message);
            } finally {
                showLoading(false);
            }
        }

        // Render students table
        function renderStudentsTable() {
            const tbody = document.getElementById('studentsTableBody');
            const noStudents = document.getElementById('noStudents');

            if (students.length === 0) {
                tbody.innerHTML = '';
                noStudents.style.display = 'block';
                return;
            }

            noStudents.style.display = 'none';
            tbody.innerHTML = students.map(student => `
                <tr>
                    <td>${student.id}</td>
                    <td>${escapeHtml(student.name)}</td>
                    <td>${escapeHtml(student.group)}</td>
                    <td class="action-buttons">
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="viewStudent(${student.id})" title="View">
                            <i class="fas fa-eye"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-warning me-1" onclick="editStudent(${student.id})" title="Edit">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteStudent(${student.id})" title="Delete">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // Show add form
        function showAddForm() {
            document.getElementById('studentModalLabel').textContent = 'Add New Student';
            document.getElementById('studentForm').reset();
            document.getElementById('studentId').value = '';
            document.getElementById('nameError').textContent = '';
            document.getElementById('groupError').textContent = '';

            const modal = new bootstrap.Modal(document.getElementById('studentModal'));
            modal.show();
        }

        // View student details
        async function viewStudent(id) {
            try {
                const response = await fetch(`/api/students/${id}`);
                if (response.ok) {
                    const student = await response.json();
                    alert(`Student Details:\n\nID: ${student.id}\nName: ${student.name}\nGroup: ${student.group}`);
                } else {
                    throw new Error('Student not found');
                }
            } catch (error) {
                console.error('Error viewing student:', error);
                alert('Error viewing student: ' + error.message);
            }
        }

        // Edit student
        async function editStudent(id) {
            try {
                const response = await fetch(`/api/students/${id}`);
                if (response.ok) {
                    const student = await response.json();

                    document.getElementById('studentModalLabel').textContent = 'Edit Student';
                    document.getElementById('studentId').value = student.id;
                    document.getElementById('name').value = student.name;
                    document.getElementById('group').value = student.group;
                    document.getElementById('nameError').textContent = '';
                    document.getElementById('groupError').textContent = '';

                    const modal = new bootstrap.Modal(document.getElementById('studentModal'));
                    modal.show();
                } else {
                    throw new Error('Student not found');
                }
            } catch (error) {
                console.error('Error loading student for edit:', error);
                alert('Error loading student: ' + error.message);
            }
        }

        // Save student (create or update)
        async function saveStudent() {
            const id = document.getElementById('studentId').value;
            const name = document.getElementById('name').value.trim();
            const group = document.getElementById('group').value.trim();

            // Basic validation
            let isValid = true;
            document.getElementById('nameError').textContent = '';
            document.getElementById('groupError').textContent = '';

            if (!name) {
                document.getElementById('nameError').textContent = 'Name is required';
                isValid = false;
            }

            if (!group) {
                document.getElementById('groupError').textContent = 'Group is required';
                isValid = false;
            }

            if (!isValid) return;

            const studentData = {
                name: name,
                group: group
            };

            try {
                let response;
                if (id) {
                    // Update existing student
                    response = await fetch(`/api/students/${id}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(studentData)
                    });
                } else {
                    // Create new student
                    response = await fetch('/api/students', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(studentData)
                    });
                }

                if (response.ok) {
                    const modal = bootstrap.Modal.getInstance(document.getElementById('studentModal'));
                    modal.hide();
                    loadStudents();
                    alert(`Student ${id ? 'updated' : 'added'} successfully!`);
                } else {
                    const error = await response.text();
                    throw new Error(error || 'Failed to save student');
                }
            } catch (error) {
                console.error('Error saving student:', error);
                alert('Error saving student: ' + error.message);
            }
        }

        // Delete student confirmation
        function deleteStudent(id) {
            studentToDelete = id;
            const modal = new bootstrap.Modal(document.getElementById('deleteModal'));
            modal.show();
        }

        // Confirm delete
        async function confirmDelete() {
            if (!studentToDelete) return;

            try {
                const response = await fetch(`/api/students/${studentToDelete}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    const modal = bootstrap.Modal.getInstance(document.getElementById('deleteModal'));
                    modal.hide();
                    loadStudents();
                    alert('Student deleted successfully!');
                } else {
                    throw new Error('Failed to delete student');
                }
            } catch (error) {
                console.error('Error deleting student:', error);
                alert('Error deleting student: ' + error.message);
            } finally {
                studentToDelete = null;
            }
        }

        // Utility functions
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Handle Enter key in search
        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                searchStudents();
            }
        });
    </script>
</body>

</html>
