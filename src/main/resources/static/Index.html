<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student & Time Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }

        .modal-content {
            background-color: white;
            padding: 2rem;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 500px;
        }

        .tab-button.active {
            border-bottom-color: #3b82f6;
            color: #3b82f6;
        }
    </style>
</head>

<body class="bg-gray-100 text-gray-800">

    <div class="container mx-auto p-4 sm:p-6 lg:p-8">
        <h1 class="text-3xl font-bold mb-6 text-center text-gray-700">Student & Time Management System</h1>

        <!-- Tab Navigation -->
        <div class="mb-6 border-b border-gray-200">
            <nav class="flex space-x-4" aria-label="Tabs">
                <button id="tab-students" onclick="switchTab('students')"
                    class="tab-button active font-medium px-3 py-2 border-b-2 border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300">Students</button>
                <button id="tab-time-entries" onclick="switchTab('time-entries')"
                    class="tab-button font-medium px-3 py-2 border-b-2 border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300">Time
                    Entries</button>
            </nav>
        </div>

        <!-- Students Table Section -->
        <div id="content-students" class="tab-content bg-white p-6 rounded-lg shadow-md">
            <div class="flex flex-col sm:flex-row justify-between items-center mb-4 gap-4">
                <h2 class="text-2xl font-semibold">Students</h2>
                <div class="flex items-center gap-2">
                    <input type="text" id="studentSearch" placeholder="Filter by name..."
                        class="w-full sm:w-auto px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                </div>
                <button onclick="openModal('studentModal')"
                    class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg shadow w-full sm:w-auto">Add
                    New Student</button>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full bg-white">
                    <thead class="bg-gray-200">
                        <tr>
                            <th class="py-3 px-4 text-left">ID</th>
                            <th class="py-3 px-4 text-left">Name</th>
                            <th class="py-3 px-4 text-left">Group</th>
                            <th class="py-3 px-4 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody">
                        <!-- Students will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Time Entries Table Section -->
        <div id="content-time-entries" class="tab-content bg-white p-6 rounded-lg shadow-md hidden">
            <div class="flex flex-col sm:flex-row justify-between items-center mb-4 gap-4">
                <h2 class="text-2xl font-semibold">Time Entries</h2>
                <div class="flex flex-col sm:flex-row items-center gap-2 w-full sm:w-auto">
                    <input type="number" id="timeEntryStudentIdSearch" placeholder="Filter by Student ID..."
                        class="w-full sm:w-auto px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                    <select id="timeEntryTypeSearch"
                        class="w-full sm:w-auto px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                        <option value="">All Types</option>
                        <option value="LAB">LAB</option>
                        <option value="EXAM_PREP">EXAM_PREP</option>
                        <option value="PROJECT">PROJECT</option>
                        <option value="CODING">CODING</option>
                        <option value="REST">REST</option>
                        <option value="LECTURE">LECTURE</option>
                    </select>
                </div>
                <button onclick="openModal('timeEntryModal')"
                    class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg shadow w-full sm:w-auto">Add
                    New Time Entry</button>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full bg-white">
                    <thead class="bg-gray-200">
                        <tr>
                            <th class="py-3 px-4 text-left">ID</th>
                            <th class="py-3 px-4 text-left">Student ID</th>
                            <th class="py-3 px-4 text-left">Type</th>
                            <th class="py-3 px-4 text-left">Description</th>
                            <th class="py-3 px-4 text-left">Start</th>
                            <th class="py-3 px-4 text-left">End</th>
                            <th class="py-3 px-4 text-left">Billable</th>
                            <th class="py-3 px-4 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="timeEntryTableBody">
                        <!-- Time Entries will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Student Modal -->
    <div id="studentModal" class="modal-backdrop hidden">
        <div class="modal-content">
            <h3 id="studentModalTitle" class="text-xl font-semibold mb-4">Add Student</h3>
            <form id="studentForm">
                <input type="hidden" id="studentId">
                <div class="mb-4">
                    <label for="studentName" class="block text-sm font-medium text-gray-700">Name *</label>
                    <input type="text" id="studentName"
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                        required>
                </div>
                <div class="mb-4">
                    <label for="studentGroup" class="block text-sm font-medium text-gray-700">Group *</label>
                    <input type="text" id="studentGroup"
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                        required>
                </div>
                <div class="flex justify-end space-x-2">
                    <button type="button" onclick="closeModal('studentModal')"
                        class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded">Cancel</button>
                    <button type="submit"
                        class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Time Entry Modal -->
    <div id="timeEntryModal" class="modal-backdrop hidden">
        <div class="modal-content">
            <h3 id="timeEntryModalTitle" class="text-xl font-semibold mb-4">Add Time Entry</h3>
            <form id="timeEntryForm">
                <input type="hidden" id="timeEntryId">
                <div class="mb-4">
                    <label for="timeEntryStudentId" class="block text-sm font-medium text-gray-700">Student ID *</label>
                    <input type="number" id="timeEntryStudentId"
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                        required>
                </div>
                <div class="mb-4">
                    <label for="timeEntryType" class="block text-sm font-medium text-gray-700">Type *</label>
                    <select id="timeEntryType"
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                        required>
                        <option value="LAB">LAB</option>
                        <option value="EXAM_PREP">EXAM_PREP</option>
                        <option value="PROJECT">PROJECT</option>
                        <option value="CODING">CODING</option>
                        <option value="REST">REST</option>
                        <option value="LECTURE">LECTURE</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label for="timeEntryDescription" class="block text-sm font-medium text-gray-700">Description
                        *</label>
                    <textarea id="timeEntryDescription" rows="3"
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                        required></textarea>
                </div>
                <div class="mb-4">
                    <label for="timeEntryStart" class="block text-sm font-medium text-gray-700">Start Time *</label>
                    <input type="datetime-local" id="timeEntryStart"
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                        required>
                </div>
                <div class="mb-4">
                    <label for="timeEntryEnd" class="block text-sm font-medium text-gray-700">End Time</label>
                    <input type="datetime-local" id="timeEntryEnd"
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div class="mb-4 flex items-center">
                    <input type="checkbox" id="timeEntryBillable"
                        class="h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                    <label for="timeEntryBillable" class="ml-2 block text-sm text-gray-900">Billable</label>
                </div>
                <div class="flex justify-end space-x-2">
                    <button type="button" onclick="closeModal('timeEntryModal')"
                        class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded">Cancel</button>
                    <button type="submit"
                        class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Custom alert/message box -->
    <div id="messageBox"
        class="fixed bottom-5 right-5 bg-green-500 text-white py-2 px-4 rounded-lg shadow-lg hidden z-50">
        <p id="messageText"></p>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8080/api';

        // --- Utility Functions ---
        function showMessage(message, isError = false) {
            const messageBox = document.getElementById('messageBox');
            const messageText = document.getElementById('messageText');
            messageText.textContent = message;
            messageBox.className = `fixed bottom-5 right-5 text-white py-2 px-4 rounded-lg shadow-lg z-50 ${isError ? 'bg-red-500' : 'bg-green-500'}`;
            messageBox.classList.remove('hidden');
            setTimeout(() => {
                messageBox.classList.add('hidden');
            }, 3000);
        }

        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            return date.toLocaleString();
        }

        // --- Tab Switching ---
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(content => content.classList.add('hidden'));
            document.querySelectorAll('.tab-button').forEach(button => button.classList.remove('active'));
            document.getElementById(`content-${tabName}`).classList.remove('hidden');
            document.getElementById(`tab-${tabName}`).classList.add('active');
        }

        // --- Modal Handling ---
        function openModal(modalId, data = null) {
            const modal = document.getElementById(modalId);
            modal.classList.remove('hidden');

            if (modalId === 'studentModal') {
                const form = document.getElementById('studentForm');
                const title = document.getElementById('studentModalTitle');
                if (data) {
                    title.textContent = 'Edit Student';
                    document.getElementById('studentId').value = data.id;
                    document.getElementById('studentName').value = data.name;
                    document.getElementById('studentGroup').value = data.group;
                } else {
                    title.textContent = 'Add Student';
                    form.reset();
                    document.getElementById('studentId').value = '';
                }
            } else if (modalId === 'timeEntryModal') {
                const form = document.getElementById('timeEntryForm');
                const title = document.getElementById('timeEntryModalTitle');
                if (data) {
                    title.textContent = 'Edit Time Entry';
                    document.getElementById('timeEntryId').value = data.id;
                    document.getElementById('timeEntryStudentId').value = data.student ? data.student.id : '';
                    document.getElementById('timeEntryType').value = data.type;
                    document.getElementById('timeEntryDescription').value = data.description;
                    document.getElementById('timeEntryStart').value = data.start ? data.start.slice(0, 16) : '';
                    document.getElementById('timeEntryEnd').value = data.end ? data.end.slice(0, 16) : '';
                    document.getElementById('timeEntryBillable').checked = data.billable;
                } else {
                    title.textContent = 'Add Time Entry';
                    form.reset();
                    document.getElementById('timeEntryId').value = '';
                }
            }
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }

        // --- Student API Calls ---
        async function fetchStudents() {
            const searchTerm = document.getElementById('studentSearch').value;
            const params = new URLSearchParams();
            if (searchTerm) {
                params.append('name', searchTerm);
            }
            const url = `${API_BASE_URL}/studentFilter?${params.toString()}`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Failed to fetch students');

                const page = await response.json();
                const data = page.content;

                const tableBody = document.getElementById('studentTableBody');
                tableBody.innerHTML = '';
                if (data) {
                    data.forEach(student => {
                        const row = `
                            <tr class="border-b">
                                <td class="py-2 px-4">${student.id}</td>
                                <td class="py-2 px-4">${student.name}</td>
                                <td class="py-2 px-4">${student.group}</td>
                                <td class="py-2 px-4 text-center">
                                    <button onclick='openModal("studentModal", ${JSON.stringify(student)})' class="text-blue-500 hover:underline mr-2">Edit</button>
                                    <button onclick="deleteStudent(${student.id})" class="text-red-500 hover:underline">Delete</button>
                                </td>
                            </tr>
                        `;
                        tableBody.innerHTML += row;
                    });
                }
            } catch (error) {
                console.error('Error fetching students:', error);
                showMessage('Error fetching students', true);
            }
        }

        async function saveStudent(event) {
            event.preventDefault();
            const id = document.getElementById('studentId').value;
            const student = {
                name: document.getElementById('studentName').value,
                group: document.getElementById('studentGroup').value
            };

            const url = id ? `${API_BASE_URL}/students/${id}` : `${API_BASE_URL}/students`;
            const method = id ? 'PUT' : 'POST';

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(student)
                });
                if (!response.ok) throw new Error(`Failed to save student. Status: ${response.status}`);

                showMessage(`Student successfully ${id ? 'updated' : 'created'}!`);
                closeModal('studentModal');
                fetchStudents();
            } catch (error) {
                console.error('Error saving student:', error);
                showMessage('Error saving student', true);
            }
        }

        async function deleteStudent(id) {
            if (!confirm('Are you sure you want to delete this student?')) return;
            try {
                const response = await fetch(`${API_BASE_URL}/students/${id}`, { method: 'DELETE' });
                if (!response.ok) throw new Error('Failed to delete student');
                showMessage('Student deleted successfully!');
                fetchStudents();
            } catch (error) {
                console.error('Error deleting student:', error);
                showMessage('Error deleting student', true);
            }
        }

        // --- Time Entry API Calls ---
        async function fetchTimeEntries() {
            const studentId = document.getElementById('timeEntryStudentIdSearch').value;
            const type = document.getElementById('timeEntryTypeSearch').value;

            const params = new URLSearchParams();
            if (studentId) params.append('studentId', studentId);
            if (type) params.append('type', type);

            const url = `${API_BASE_URL}/timeEntryFilter?${params.toString()}`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Failed to fetch time entries');

                const page = await response.json();
                const data = page.content;

                const tableBody = document.getElementById('timeEntryTableBody');
                tableBody.innerHTML = '';
                if (data) {
                    data.forEach(entry => {
                        const row = `
                            <tr class="border-b">
                                <td class="py-2 px-4">${entry.id}</td>
                                <td class="py-2 px-4">${entry.student ? entry.student.id : 'N/A'}</td>
                                <td class="py-2 px-4">${entry.type || 'N/A'}</td>
                                <td class="py-2 px-4">${entry.description || 'N/A'}</td>
                                <td class="py-2 px-4">${formatDate(entry.start)}</td>
                                <td class="py-2 px-4">${formatDate(entry.end)}</td>
                                <td class="py-2 px-4">${entry.billable ? 'Yes' : 'No'}</td>
                                <td class="py-2 px-4 text-center">
                                   <button onclick='openModal("timeEntryModal", ${JSON.stringify(entry)})' class="text-blue-500 hover:underline mr-2">Edit</button>
                                   <button onclick="deleteTimeEntry(${entry.id})" class="text-red-500 hover:underline">Delete</button>
                                </td>
                            </tr>
                        `;
                        tableBody.innerHTML += row;
                    });
                }
            } catch (error) {
                console.error('Error fetching time entries:', error);
                showMessage('Error fetching time entries', true);
            }
        }

        async function saveTimeEntry(event) {
            event.preventDefault();
            const id = document.getElementById('timeEntryId').value;

            // Собираем данные с отладкой
            const timeEntryData = {
                student: { id: parseInt(document.getElementById('timeEntryStudentId').value) },
                type: document.getElementById('timeEntryType').value,
                description: document.getElementById('timeEntryDescription').value,
                start: document.getElementById('timeEntryStart').value ? new Date(document.getElementById('timeEntryStart').value).toISOString() : null,
                end: document.getElementById('timeEntryEnd').value ? new Date(document.getElementById('timeEntryEnd').value).toISOString() : null,
                billable: document.getElementById('timeEntryBillable').checked
            };

            console.log('Sending time entry data:', timeEntryData);

            const url = id ? `${API_BASE_URL}/timeEntries/${id}` : `${API_BASE_URL}/timeEntries`;
            const method = id ? 'PUT' : 'POST';

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(timeEntryData)
                });

                console.log('Response status:', response.status);

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('Server error response:', errorText);
                    throw new Error(`Failed to save time entry. Status: ${response.status}. Message: ${errorText}`);
                }

                const savedEntry = await response.json();
                console.log('Successfully saved:', savedEntry);

                showMessage(`Time entry successfully ${id ? 'updated' : 'created'}!`);
                closeModal('timeEntryModal');
                fetchTimeEntries();
            } catch (error) {
                console.error('Error saving time entry:', error);
                showMessage('Error saving time entry: ' + error.message, true);
            }
        }

        async function deleteTimeEntry(id) {
            if (!confirm('Are you sure you want to delete this time entry?')) return;
            try {
                const response = await fetch(`${API_BASE_URL}/timeEntries/${id}`, { method: 'DELETE' });
                if (!response.ok) throw new Error('Failed to delete time entry');
                showMessage('Time entry deleted successfully!');
                fetchTimeEntries();
            } catch (error) {
                console.error('Error deleting time entry:', error);
                showMessage('Error deleting time entry', true);
            }
        }

        // --- Debounce function for search inputs ---
        function debounce(func, delay) {
            let timeout;
            return function (...args) {
                const context = this;
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(context, args), delay);
            };
        }

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            fetchStudents();
            fetchTimeEntries();

            document.getElementById('studentForm').addEventListener('submit', saveStudent);
            document.getElementById('timeEntryForm').addEventListener('submit', saveTimeEntry);

            // --- Search Event Listeners ---
            const debouncedStudentSearch = debounce(fetchStudents, 300);
            document.getElementById('studentSearch').addEventListener('input', debouncedStudentSearch);

            const debouncedTimeEntrySearch = debounce(fetchTimeEntries, 300);
            document.getElementById('timeEntryStudentIdSearch').addEventListener('input', debouncedTimeEntrySearch);
            document.getElementById('timeEntryTypeSearch').addEventListener('change', debouncedTimeEntrySearch);
        });
    </script>
</body>

</html>
